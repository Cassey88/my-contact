name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build debug APK
        shell: bash
        working-directory: android
        run: gradle assembleDebug -PverCode=${{ github.run_number }} --stacktrace 2>&1 | tee ../build.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyContact.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: My Contact 1.${{ github.run_number }}
          files: MyContact.apk

      - name: Publish log tail on failure
        if: failure()
        run: |
          tail -n 150 build.log > /tmp/tail.txt 2>/dev/null || echo "no build log" > /tmp/tail.txt
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan build-logs
          git rm -rf . -q || true
          cp /tmp/tail.txt build-log.txt
          git add build-log.txt
          git commit -m "build log run ${{ github.run_number }}"
          git push -f origin build-logs
